openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - ClerkSession: []
tags:
  - name: health
    description: Health operations
  - name: kalshi
    description: Kalshi sports trade monitoring and Telegram alerts
paths:
  /kalshi/explorer:
    get:
      operationId: getKalshiExplorer
      tags: [kalshi]
      summary: Browse saved sports markets and selected market executions
      parameters:
        - in: query
          name: band
          schema:
            type: string
            enum: [large, medium]
            default: large
        - in: query
          name: scope
          schema:
            type: string
            enum: [active, history]
            default: active
        - in: query
          name: ticker
          schema:
            type: string
            maxLength: 200
        - in: query
          name: window
          schema:
            type: string
            enum: [1h, 24h, all]
            default: all
      responses:
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/OwnerRequired"
        "503":
          $ref: "#/components/responses/OwnerUnavailable"
        "400":
          description: Invalid explorer filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Saved catalog and selected market activity, newest 5000 executions at most
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KalshiExplorer"
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /kalshi/dashboard:
    get:
      operationId: getKalshiDashboard
      tags: [kalshi]
      summary: Get monitor status and recent qualifying sports trades
      responses:
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/OwnerRequired"
        "503":
          $ref: "#/components/responses/OwnerUnavailable"
        "200":
          description: Dashboard status and recent trades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KalshiDashboard"
  /kalshi/settings:
    put:
      operationId: saveKalshiSettings
      tags: [kalshi]
      summary: Save sports trade alert settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KalshiSettingsInput"
      responses:
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/OwnerRequired"
        "503":
          $ref: "#/components/responses/OwnerUnavailable"
        "200":
          description: Settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KalshiDashboard"
        "400":
          description: Invalid settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /kalshi/telegram/find-chat:
    post:
      operationId: findTelegramChat
      tags: [kalshi]
      summary: Get the owner-locked Telegram destination
      responses:
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/OwnerRequired"
        "503":
          $ref: "#/components/responses/OwnerUnavailable"
        "200":
          description: Chat lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramChatLookup"
  /kalshi/telegram/test:
    post:
      operationId: sendTelegramTest
      tags: [kalshi]
      summary: Refresh the owner-locked Telegram dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramTestInput"
      responses:
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/OwnerRequired"
        "503":
          $ref: "#/components/responses/OwnerUnavailable"
        "200":
          description: Test message result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramTestResult"
        "400":
          description: Invalid destination or bot configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    ClerkSession:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk browser session. Kalshi routes also require the configured owner's verified email.
  responses:
    SignInRequired:
      description: Sign in is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    OwnerRequired:
      description: Only the configured owner can access this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    OwnerUnavailable:
      description: Owner authorization is unavailable or not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ExplorerMarket:
      type: object
      required: [ticker, sport, gameKey, gameName, gameDateLabel, betLabel, marketUrl, trades, lastTradeAt, state, gameResult, marketResult]
      properties:
        ticker: { type: string }
        sport: { type: string }
        gameKey: { type: string }
        gameName: { type: string }
        gameDateLabel: { type: string }
        betLabel: { type: string }
        marketUrl: { type: string }
        trades: { type: integer }
        lastTradeAt: { type: string }
        state: { type: string, enum: [upcoming, live, finished, unknown] }
        gameResult:
          type: [string, "null"]
          description: Confirmed final scoreboard from Kalshi; null if unavailable, not inferred from settlement
        marketResult:
          type: [string, "null"]
          description: Kalshi settlement of this specific bet, separate from the game's score
    ExplorerTrade:
      type: object
      required: [tradeId, ticker, direction, price, count, notional, createdTime]
      properties:
        tradeId: { type: string }
        ticker: { type: string }
        direction: { type: string, enum: [yes, no, unknown] }
        price: { type: number }
        count: { type: number }
        notional: { type: number }
        createdTime: { type: string }
    KalshiExplorer:
      type: object
      required: [generatedAt, workersPaused, markets, trades, totalTrades, truncated, historyStatus]
      properties:
        generatedAt: { type: string }
        workersPaused: { type: boolean }
        markets:
          type: array
          items: { $ref: "#/components/schemas/ExplorerMarket" }
        trades:
          type: array
          items: { $ref: "#/components/schemas/ExplorerTrade" }
        totalTrades: { type: integer }
        truncated: { type: boolean }
        historyStatus:
          type: string
          description: Stored import status; never claims all Kalshi history is complete
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    KalshiTrade:
      type: object
      properties:
        tradeId:
          type: string
        ticker:
          type: string
        title:
          type: string
        sport:
          type: string
        outcomeSide:
          type: string
        bookSide:
          type: string
        price:
          type: number
        count:
          type: number
        notional:
          type: number
        createdTime:
          type: string
        blockTrade:
          type: boolean
        marketUrl:
          type: string
      required:
        - tradeId
        - ticker
        - title
        - sport
        - outcomeSide
        - bookSide
        - price
        - count
        - notional
        - createdTime
        - blockTrade
        - marketUrl
    KalshiDashboard:
      type: object
      properties:
        enabled:
          type: boolean
        minimumNotional:
          type: number
        chatId:
          type: ["string", "null"]
        telegramConfigured:
          type: boolean
        status:
          type: string
        lastChecked:
          type: ["string", "null"]
        lastError:
          type: ["string", "null"]
        qualifyingTrades:
          type: integer
        alertsSent:
          type: integer
        recentTrades:
          type: array
          items:
            $ref: "#/components/schemas/KalshiTrade"
      required:
        - enabled
        - minimumNotional
        - chatId
        - telegramConfigured
        - status
        - lastChecked
        - lastError
        - qualifyingTrades
        - alertsSent
        - recentTrades
    KalshiSettingsInput:
      type: object
      properties:
        enabled:
          type: boolean
        minimumNotional:
          type: number
          minimum: 1
        chatId:
          type: string
          minLength: 1
      required:
        - enabled
        - minimumNotional
        - chatId
    TelegramChatLookup:
      type: object
      properties:
        found:
          type: boolean
        chatId:
          type: ["string", "null"]
        displayName:
          type: ["string", "null"]
        message:
          type: string
      required:
        - found
        - chatId
        - displayName
        - message
    TelegramTestInput:
      type: object
      properties:
        chatId:
          type: string
          minLength: 1
      required:
        - chatId
    TelegramTestResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message

