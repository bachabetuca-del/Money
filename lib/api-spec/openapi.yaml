openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - ClerkSession: []
tags:
  - name: health
    description: Health operations
  - name: kalshi
    description: Kalshi sports trade monitoring and Telegram alerts
paths:
  /kalshi/explorer/roi:
    get:
      operationId: getKalshiExplorerRoi
      tags: [kalshi]
      summary: Historical ROI context for comparable sport, market, side, odds and trade-size groups
      parameters:
        - in: query
          name: band
          schema: { type: string, enum: [large, medium, small], default: large }
        - in: query
          name: scope
          schema: { type: string, enum: [active, history], default: active }
      responses:
        "200":
          description: Verified historical comparison, not a prediction or the live game's realized ROI
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExplorerRoi" }
        "400":
          description: Invalid filters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: ROI context could not be refreshed; the explorer remains available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /kalshi/leaderboard:
    get:
      operationId: getKalshiLeaderboard
      tags: [kalshi]
      summary: Equal-stake hypothetical ROI from saved trades and official binary settlements
      parameters:
        - in: query
          name: coverage
          schema: { type: string, enum: [verified, all], default: verified }
        - in: query
          name: groupBy
          schema: { type: string, enum: [sport, marketType, odds, segment, market, amount], default: segment }
        - in: query
          name: sortBy
          schema: { type: string, enum: [roi, winRate], default: roi }
        - in: query
          name: window
          schema: { type: string, enum: [all, 30d, 7d], default: all }
        - in: query
          name: band
          schema: { type: string, enum: [all, large, medium, small], default: all }
        - in: query
          name: direction
          schema: { type: string, enum: [all, yes, no], default: all }
        - in: query
          name: minGames
          schema: { type: integer, minimum: 1, maximum: 1000, default: 10 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
      responses:
        "200":
          description: Saved-history ranking, never trader profits or a forecast
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoiLeaderboard" }
        "400":
          description: Invalid filters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Ranking could not be refreshed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /kalshi/history/export:
    get:
      operationId: downloadKalshiHistory
      tags: [kalshi]
      summary: Download every stored execution, without dashboard filters or row limits
      parameters:
        - in: query
          name: format
          required: true
          schema: { type: string, enum: [json, csv] }
      responses:
        "200":
          description: Complete database snapshot; not a guarantee of complete Kalshi exchange history
          content:
            application/json:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string, format: binary }
  /kalshi/analysis:
    get:
      operationId: getKalshiAnalysis
      tags: [kalshi]
      summary: Retrieve the last saved game analysis without calling the AI
      parameters:
        - in: query
          name: ticker
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Saved analysis and AI availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameAnalysisState" }
    post:
      operationId: analyzeKalshiGame
      tags: [kalshi]
      summary: Manually analyze a selected bet using saved activity across its game
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameAnalysisInput" }
      responses:
        "200":
          description: Persisted Spanish analysis with timestamp and source coverage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameAnalysis" }
        "429":
          description: A generation is in progress or the short cooldown has not elapsed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /kalshi/live:
    get:
      operationId: streamKalshiActivity
      tags: [kalshi]
      summary: Owner-only grouped activity invalidations
      responses:
        "200":
          description: SSE ready and trades events include affected tickers and freshTradeIds for new live executions only, never imports or REST recovery. Refresh snapshots on connection and reconnect.
          content:
            text/event-stream:
              schema: { type: string }
  /kalshi/explorer:
    get:
      operationId: getKalshiExplorer
      tags: [kalshi]
      summary: Browse saved sports markets and selected market executions
      parameters:
        - in: query
          name: band
          schema:
            type: string
            enum: [large, medium, small]
            default: large
        - in: query
          name: scope
          schema:
            type: string
            enum: [active, history]
            default: active
        - in: query
          name: ticker
          schema:
            type: string
            maxLength: 200
        - in: query
          name: window
          schema:
            type: string
            enum: [1h, 24h, all]
            default: all
        - in: query
          name: direction
          description: Filter catalog and executions by public YES or NO direction; not proof of opening or closing a position.
          schema:
            type: string
            enum: [all, yes, no]
            default: all
        - in: query
          name: marketType
          description: Classify saved markets using their series identifier and original titles; ambiguous markets remain in other.
          schema:
            type: string
            enum: [all, winner, periodWinner, spread, total, btts, correctScore, qualification, corners, props, futures, other]
            default: all
        - in: query
          name: view
          description: Detail omits the repeated catalog payload but still validates the selected market against all filters. Full preserves the original response.
          schema:
            type: string
            enum: [full, detail]
            default: full
      responses:
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/OwnerRequired"
        "503":
          $ref: "#/components/responses/OwnerUnavailable"
        "400":
          description: Invalid explorer filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Saved catalog and selected market activity, newest 5000 executions at most
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KalshiExplorer"
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /kalshi/dashboard:
    get:
      operationId: getKalshiDashboard
      tags: [kalshi]
      summary: Get monitor status and recent qualifying sports trades
      responses:
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/OwnerRequired"
        "503":
          $ref: "#/components/responses/OwnerUnavailable"
        "200":
          description: Dashboard status and recent trades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KalshiDashboard"
  /kalshi/settings:
    put:
      operationId: saveKalshiSettings
      tags: [kalshi]
      summary: Save sports trade alert settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KalshiSettingsInput"
      responses:
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/OwnerRequired"
        "503":
          $ref: "#/components/responses/OwnerUnavailable"
        "200":
          description: Settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KalshiDashboard"
        "400":
          description: Invalid settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /kalshi/telegram/find-chat:
    post:
      operationId: findTelegramChat
      tags: [kalshi]
      summary: Get the owner-locked Telegram destination
      responses:
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/OwnerRequired"
        "503":
          $ref: "#/components/responses/OwnerUnavailable"
        "200":
          description: Chat lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramChatLookup"
  /kalshi/telegram/test:
    post:
      operationId: sendTelegramTest
      tags: [kalshi]
      summary: Refresh the owner-locked Telegram dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramTestInput"
      responses:
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/OwnerRequired"
        "503":
          $ref: "#/components/responses/OwnerUnavailable"
        "200":
          description: Test message result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramTestResult"
        "400":
          description: Invalid destination or bot configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    ClerkSession:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk browser session. Kalshi routes also require the configured owner's verified email.
  responses:
    SignInRequired:
      description: Sign in is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    OwnerRequired:
      description: Only the configured owner can access this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    OwnerUnavailable:
      description: Owner authorization is unavailable or not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    RoiLeaderboard:
      type: object
      required: [generatedAt, stakePerTrade, largeTradeThreshold, summary, rows, totalRows, page, pageSize, totalPages, groupBy, sortBy, window, band, direction, minGames, coverage]
      properties:
        generatedAt: { type: string, format: date-time }
        stakePerTrade: { type: number }
        largeTradeThreshold:
          type: number
          description: Actual minimum applied when the large-operation filter is selected; canonical money bands still use $10,000 as their boundary.
        coverage: { type: string, enum: [verified, all] }
        groupBy: { type: string, enum: [sport, marketType, odds, segment, market, amount] }
        sortBy: { type: string, enum: [roi, winRate] }
        window: { type: string, enum: [all, 30d, 7d] }
        band: { type: string, enum: [all, large, medium, small] }
        direction: { type: string, enum: [all, yes, no] }
        minGames: { type: integer }
        summary: { $ref: "#/components/schemas/RoiCoverage" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/RoiRankingRow" }
        totalRows: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    RoiCoverage:
      type: object
      required: [savedTrades, settledTrades, pendingTrades, excludedTrades, settledMarkets, pendingMarkets, games, roiPct, profit, recentRoiPct, recentTrades, firstTradeAt, lastTradeAt, lastSettlementCheckAt, settlementErrors, verifiedHistoryMarkets, incompleteHistoryMarkets, historyErrorMarkets, historyExcludedTrades]
      properties:
        savedTrades: { type: integer }
        settledTrades: { type: integer }
        pendingTrades: { type: integer }
        excludedTrades: { type: integer }
        settledMarkets: { type: integer }
        pendingMarkets: { type: integer }
        games: { type: integer }
        roiPct: { type: [number, "null"] }
        profit: { type: number }
        recentRoiPct: { type: [number, "null"] }
        recentTrades: { type: integer }
        firstTradeAt: { type: [string, "null"], format: date-time }
        lastTradeAt: { type: [string, "null"], format: date-time }
        lastSettlementCheckAt: { type: [string, "null"], format: date-time }
        settlementErrors: { type: integer }
        verifiedHistoryMarkets: { type: integer }
        incompleteHistoryMarkets: { type: integer }
        historyErrorMarkets: { type: integer }
        historyExcludedTrades: { type: integer }
    RoiRankingRow:
      type: object
      required: [id, rank, label, sport, marketType, side, moneyBand, marketUrl, oddsMin, oddsMax, trades, games, markets, wins, losses, winRatePct, roiPct, profit, invested, recentRoiPct, recentTrades, sampleWarning, weekly, moneyBands]
      properties:
        id: { type: string }
        rank: { type: integer }
        label: { type: string }
        sport: { type: [string, "null"] }
        marketType: { type: [string, "null"] }
        side:
          type: [string, "null"]
          enum: [yes, no, null]
          description: Observed outcome side; null only for aggregate views combining both sides. Combined segments always separate YES from NO.
        moneyBand:
          type: [string, "null"]
          enum: [small, medium, large, null]
          description: Observed transaction size; null when the group includes multiple monetary bands. This is not the hypothetical stake.
        marketUrl: { type: [string, "null"] }
        oddsMin: { type: [number, "null"] }
        oddsMax: { type: [number, "null"] }
        trades: { type: integer }
        games: { type: integer }
        markets: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        winRatePct: { type: number }
        roiPct: { type: number }
        profit: { type: number }
        invested: { type: number }
        recentRoiPct: { type: [number, "null"] }
        recentTrades: { type: integer }
        sampleWarning: { type: boolean }
        weekly:
          type: array
          items: { $ref: "#/components/schemas/RoiWeekPerformance" }
        moneyBands:
          type: array
          items: { $ref: "#/components/schemas/RoiMoneyPerformance" }
    RoiWeekPerformance:
      type: object
      required: [weekStart, trades, games, wins, profit, roiPct, winRatePct, partial, sampleWarning]
      properties:
        weekStart:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Monday local calendar date in America/New_York, grouped by execution time rather than settlement time. Empty intervening weeks have null rates.
        trades: { type: integer }
        games: { type: integer }
        wins: { type: integer }
        profit: { type: number }
        roiPct: { type: [number, "null"] }
        winRatePct: { type: [number, "null"] }
        partial:
          type: boolean
          description: The calendar week is still open or is clipped by the selected time window. False does not certify complete exchange-wide coverage.
        sampleWarning: { type: boolean }
    RoiMoneyPerformance:
      type: object
      required: [band, trades, games, wins, profit, roiPct, winRatePct, sampleWarning, meetsMinimum]
      properties:
        band:
          type: string
          enum: [small, medium, large]
          description: "small: $1,000–$5,000 inclusive; medium: strictly above $5,000 and below $10,000; large: $10,000 and above. Other selected filters still apply."
        trades: { type: integer }
        games: { type: integer }
        wins: { type: integer }
        profit: { type: number }
        roiPct: { type: [number, "null"] }
        winRatePct: { type: [number, "null"] }
        sampleWarning: { type: boolean }
        meetsMinimum:
          type: boolean
          description: Whether this monetary subgroup meets the selected minimum distinct-game count.
    GameAnalysisInput:
      type: object
      required: [ticker]
      properties:
        ticker: { type: string, minLength: 1, maxLength: 200 }
    GameAnalysisState:
      type: object
      required: [available, analysis]
      properties:
        available: { type: boolean }
        analysis:
          anyOf:
            - { $ref: "#/components/schemas/GameAnalysis" }
            - { type: "null" }
    GameAnalysis:
      type: object
      required: [ticker, gameName, betLabel, generatedAt, model, totalTrades, totalMarkets, includedMarkets, latestTradeAt, dataThrough, text]
      properties:
        ticker: { type: string }
        gameName: { type: string }
        betLabel: { type: string }
        generatedAt: { type: string, format: date-time }
        model: { type: string }
        totalTrades: { type: integer }
        totalMarkets: { type: integer }
        includedMarkets: { type: integer }
        latestTradeAt: { type: ["string", "null"], format: date-time }
        dataThrough: { type: string, format: date-time }
        text: { type: string }
    ExplorerRoiSignal:
      type: object
      required: [side, level, reason, roiPct, trades, games, price, observedAt, oddsMin, oddsMax]
      properties:
        side: { type: string, enum: [yes, no] }
        level: { type: string, enum: [good, medium, bad, insufficient] }
        reason:
          type: [string, "null"]
          enum: [no_price, no_history, small_sample, unclassified, null]
        roiPct: { type: [number, "null"] }
        trades: { type: integer }
        games: { type: integer }
        price:
          type: [number, "null"]
          description: Last saved execution price of this side within the selected money band; not a live quote
        observedAt: { type: [string, "null"] }
        oddsMin: { type: [number, "null"] }
        oddsMax: { type: [number, "null"] }
    ExplorerMarketRoi:
      type: object
      required: [ticker, signals]
      properties:
        ticker: { type: string }
        signals:
          type: array
          items: { $ref: "#/components/schemas/ExplorerRoiSignal" }
    ExplorerRoi:
      type: object
      required: [generatedAt, historyAsOf, band, scope, minimumGames, minimumTrades, greenMinRoiPct, markets]
      properties:
        generatedAt: { type: string }
        historyAsOf: { type: string }
        band: { type: string, enum: [large, medium, small] }
        scope: { type: string, enum: [active, history] }
        minimumGames: { type: integer }
        minimumTrades: { type: integer }
        greenMinRoiPct: { type: number }
        markets:
          type: array
          items: { $ref: "#/components/schemas/ExplorerMarketRoi" }
    ExplorerMarket:
      type: object
      required: [ticker, sport, gameKey, gameName, gameDateLabel, betLabel, marketUrl, trades, lastTradeAt, state, gameResult, marketResult]
      properties:
        ticker: { type: string }
        sport: { type: string }
        gameKey: { type: string }
        gameName: { type: string }
        gameDateLabel: { type: string }
        gameTimeLabel:
          type: string
          description: Scheduled kickoff in America/New_York with ET suffix, or Hora por confirmar
        gameStartsAt:
          type: [string, "null"]
          description: Confirmed scheduled kickoff as an ISO timestamp; null when unknown
        betLabel: { type: string }
        marketUrl: { type: string }
        trades: { type: integer }
        lastTradeAt: { type: string }
        state: { type: string, enum: [upcoming, live, finished, unknown] }
        gameResult:
          type: [string, "null"]
          description: Confirmed final scoreboard from Kalshi; null if unavailable, not inferred from settlement
        scoreStatus:
          type: string
          enum: [confirmed, pending, unavailable]
          description: Whether a final score is saved, queued for retrieval, or unavailable after bounded attempts
        scoreMessage:
          type: [string, "null"]
          description: Honest explanation of queued, temporarily failed, or missing provider score
        marketResult:
          type: [string, "null"]
          description: Kalshi settlement of this specific bet, separate from the game's score
    ExplorerTrade:
      type: object
      required: [tradeId, ticker, direction, price, count, notional, createdTime]
      properties:
        tradeId: { type: string }
        ticker: { type: string }
        direction: { type: string, enum: [yes, no, unknown] }
        price: { type: number }
        count: { type: number }
        notional: { type: number }
        createdTime: { type: string }
    KalshiExplorer:
      type: object
      required: [generatedAt, workersPaused, markets, trades, totalTrades, truncated, historyStatus]
      properties:
        flow:
          type: array
          items: { $ref: "#/components/schemas/MarketFlowWindow" }
        generatedAt: { type: string }
        workersPaused: { type: boolean }
        markets:
          type: array
          items: { $ref: "#/components/schemas/ExplorerMarket" }
        trades:
          type: array
          items: { $ref: "#/components/schemas/ExplorerTrade" }
        totalTrades: { type: integer }
        truncated: { type: boolean }
        historyStatus:
          type: string
          description: Stored import status; never claims all Kalshi history is complete
    MarketFlowWindow:
      type: object
      required: [minutes, yesUsd, noUsd, unknownUsd, yesCount, noCount, unknownCount, balanceUsd, largeYesCount, largeNoCount, largeYesUsd, largeNoUsd]
      properties:
        minutes: { type: integer }
        yesUsd: { type: number }
        noUsd: { type: number }
        unknownUsd: { type: number }
        yesCount: { type: integer }
        noCount: { type: integer }
        unknownCount: { type: integer }
        balanceUsd: { type: number }
        largeYesCount: { type: integer }
        largeNoCount: { type: integer }
        largeYesUsd: { type: number }
        largeNoUsd: { type: number }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    KalshiTrade:
      type: object
      properties:
        tradeId:
          type: string
        ticker:
          type: string
        title:
          type: string
        sport:
          type: string
        outcomeSide:
          type: string
        bookSide:
          type: string
        price:
          type: number
        count:
          type: number
        notional:
          type: number
        createdTime:
          type: string
        blockTrade:
          type: boolean
        marketUrl:
          type: string
      required:
        - tradeId
        - ticker
        - title
        - sport
        - outcomeSide
        - bookSide
        - price
        - count
        - notional
        - createdTime
        - blockTrade
        - marketUrl
    KalshiDashboard:
      type: object
      properties:
        workersPaused:
          type: boolean
        enabled:
          type: boolean
        minimumNotional:
          type: number
        chatId:
          type: ["string", "null"]
        telegramConfigured:
          type: boolean
        status:
          type: string
        lastChecked:
          type: ["string", "null"]
        lastError:
          type: ["string", "null"]
        qualifyingTrades:
          type: integer
        alertsSent:
          type: integer
        recentTrades:
          type: array
          items:
            $ref: "#/components/schemas/KalshiTrade"
      required:
        - workersPaused
        - enabled
        - minimumNotional
        - chatId
        - telegramConfigured
        - status
        - lastChecked
        - lastError
        - qualifyingTrades
        - alertsSent
        - recentTrades
    KalshiSettingsInput:
      type: object
      properties:
        enabled:
          type: boolean
        minimumNotional:
          type: number
          minimum: 1
          maximum: 999999999999.99
        chatId:
          type: string
          minLength: 1
      required:
        - enabled
        - minimumNotional
        - chatId
    TelegramChatLookup:
      type: object
      properties:
        found:
          type: boolean
        chatId:
          type: ["string", "null"]
        displayName:
          type: ["string", "null"]
        message:
          type: string
      required:
        - found
        - chatId
        - displayName
        - message
    TelegramTestInput:
      type: object
      properties:
        chatId:
          type: string
          minLength: 1
      required:
        - chatId
    TelegramTestResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message

